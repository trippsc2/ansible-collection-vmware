---
name: Generate Role Docs
'on':
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - galaxy.yml
      - roles/deploy_vm/.aar_doc.yml
      - roles/deploy_vm/README.md
      - roles/deploy_vm/meta/argument_specs.yml
      - roles/deploy_vm/meta/main.yml
defaults:
  run:
    working-directory: 'trippsc2.vmware'
jobs:
  docs_deploy_vm:
    name: Generate deploy_vm role documentation
    permissions:
      contents: write
    runs-on:
      - self-hosted
      - linux
      - ansible
      - x64
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: trippsc2.vmware
          ref: main
      - name: Generate deploy_vm role documentation
        working-directory: 'trippsc2.vmware'
        run: |
          source ~/venv/ansible-2.16/bin/activate
          cd ./roles/deploy_vm
          aar-doc . markdown
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          git add README.md || /bin/true
          git commit -m "Update deploy_vm role documentation." || /bin/true
          git push origin main
          deactivate
